version: '3.8'

services:
  # 向量資料庫節點
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: ems-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # FastAPI 後端應用節點
  backend:
    build: ./backend
    container_name: ems-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=qdrant
    volumes:
      - ./backend:/app  # 掛載本機目錄，方便在 VS Code 改 code 時容器同步熱更新
    depends_on:
      - qdrant

volumes:
  qdrant_storage: